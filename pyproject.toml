[project]
name = "technical-doc-assistant"
version = "0.1.0"
description = "Naive RAG baseline over Pydantic docs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai==3.13.0",
    "chromadb==1.5.9",
    "tiktoken==0.14.0",
    "pydantic==2.13.5",
    "click==8.5.0",
    "python-dotenv==1.2.3",
    "tenacity==9.1.4",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.7",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
